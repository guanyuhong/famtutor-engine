name: GeoGebra verified reference blob ingestion
on:
  push:
    branches: [codex/geogebra-pr10-v04-20261013]
    paths: [scripts/geogebra/ingest-reference-artifact.py, .github/workflows/geogebra-reference-ingest.yml]
permissions:
  contents: write
  actions: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate independent evidence and create blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/geogebra/ingest-reference-artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: geogebra-reference-ingested-blob
          path: artifacts/reference-ingest/ingested-blob.json
          retention-days: 7
