name: GeoGebra independent pointer parity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pointer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: pip install -r requirements-smoke.txt && python -m playwright install --with-deps chromium
      - name: Exact source and unchanged original regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/pointer-v2
          git rev-parse HEAD > artifacts/pointer-v2/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/pointer-v2/tree.txt
          npm test 2>&1 | tee artifacts/pointer-v2/node.log
          node --test packages/math/test/pointer-evaluation.test.mjs packages/math/test/pointer-contract.test.mjs packages/math/test/pointer-activation.test.mjs packages/math/test/pointer-unrelated-undefined.test.mjs > artifacts/pointer-v2/focused.tap
          python scripts/geogebra/pointer-v2/test_protocol.py > artifacts/pointer-v2/protocol-tests.log 2>&1
          python scripts/geogebra/pointer-v2/test_coverage.py > artifacts/pointer-v2/coverage-tests.log 2>&1
      - name: Protocol v2 native independent capture (three repetitions, no retries)
        run: python scripts/geogebra/pointer-v2/capture.py --engine famtutor --output artifacts/pointer-v2/native.json
      - name: Protocol v2 fixed GeoGebra independent capture (three repetitions, no retries)
        if: ${{ !cancelled() }}
        run: python scripts/geogebra/pointer-v2/capture.py --engine geogebra --output artifacts/pointer-v2/reference.json
      - name: Actual delivery windows and all ordered public observations
        if: ${{ !cancelled() }}
        run: python scripts/geogebra/pointer-v2/compare.py artifacts/pointer-v2/native.json artifacts/pointer-v2/reference.json artifacts/pointer-v2/comparison.json
      - name: Separate instrumented native internal-surface replay (not reference parity)
        if: ${{ !cancelled() }}
        run: |
          python scripts/geogebra/pointer-v2/capture.py --engine famtutor --replicates 1 --audit-native --output artifacts/pointer-v2/audit.json
          python scripts/geogebra/pointer-v2/audit.py artifacts/pointer-v2/audit.json artifacts/pointer-v2/audit-comparison.json
      - name: Retained warning-only host policy real-pointer regression
        if: ${{ !cancelled() }}
        run: |
          python scripts/geogebra/pointer-v2/capture.py --engine famtutor --replicates 1 --audit-native --native-warning --output artifacts/pointer-v2/warning-audit.json
          python scripts/geogebra/pointer-v2/audit.py artifacts/pointer-v2/warning-audit.json artifacts/pointer-v2/warning-audit-comparison.json
      - name: Source unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pointer-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pointer-v2/
          retention-days: 14
          if-no-files-found: error
