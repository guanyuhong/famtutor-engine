name: GeoGebra compatibility

on:
  push:
    branches: [codex/geogebra-case-runtime-v02]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geogebra-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build original core and math
        run: npm ci && npm run build
      - name: Original and new Node regressions
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/node-tests.log
      - name: Build original-renderer gallery
        run: node scripts/geogebra/build-gallery.mjs
      - name: Strict GeoGebra differential gate
        id: differential
        continue-on-error: true
        run: |
          node scripts/geogebra/compare-reference.mjs > artifacts/comparison.json
      - name: Package reproducible source and results
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          git archive --format=tar HEAD packages scripts docs research corpus gallery package.json package-lock.json requirements-smoke.txt AGENTS.md LICENSE README.md .github | gzip -n > artifacts/source.tar.gz
          if test -d packages/math/dist; then
            tar -czf artifacts/built-packages.tar.gz packages/core/dist packages/math/dist
          fi
          if test -f examples/geogebra/index.html; then
            cp examples/geogebra/index.html artifacts/geogebra-workbench.html
          fi
          sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: famtutor-geogebra-development-snapshot
          path: artifacts/
          retention-days: 7
      - name: Do not approve known differential failures
        if: steps.differential.outcome == 'failure'
        run: |
          echo 'Native regressions and compatibility parity are different gates. See comparison.json.'
          exit 1
