name: GeoGebra native API parity
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: pip install -r requirements-smoke.txt && python -m playwright install --with-deps chromium
      - name: Exact source and original regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-api
          git rev-parse HEAD > artifacts/native-api/commit.txt
          git rev-parse HEAD^{tree} > artifacts/native-api/tree.txt
          npm test 2>&1 | tee artifacts/native-api/node.log
          node --test --test-reporter=tap packages/math/test/native-api.test.mjs scripts/geogebra/native-api-contract.test.mjs > artifacts/native-api/focused.tap
          node --test --test-reporter=tap packages/math/test/native-api-state.test.mjs > artifacts/native-api/state-focused.tap
          python scripts/geogebra/native-api/test_runtime_pin.py
      - name: Independently execute the identical public API program
        run: |
          node scripts/geogebra/native-api/run-native.mjs artifacts/native-api/native.json
          python scripts/geogebra/native-api/capture-reference.py --output artifacts/native-api/reference.json
          node scripts/geogebra/native-api/compare.mjs artifacts/native-api/native.json artifacts/native-api/reference.json artifacts/native-api/comparison.json
      - name: Native pointer and state roundtrip acceptance
        run: python scripts/geogebra/native-api/browser.py > artifacts/native-api/browser.log
      - name: Controlled mounted undefined and canonical recovery
        env:
          STATE_EVIDENCE_DIR: artifacts/native-api/state
        run: python scripts/geogebra/native-api/state-browser.py > artifacts/native-api/state-browser.log
      - name: Versioned symmetric pointer protocol and focused guards
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-api/pointer-v2
          cp artifacts/native-api/commit.txt artifacts/native-api/tree.txt artifacts/native-api/pointer-v2/
          node --test packages/math/test/pointer-evaluation.test.mjs packages/math/test/pointer-contract.test.mjs packages/math/test/pointer-activation.test.mjs packages/math/test/pointer-unrelated-undefined.test.mjs > artifacts/native-api/pointer-v2/focused.tap
          python scripts/geogebra/pointer-v2/test_protocol.py > artifacts/native-api/pointer-v2/protocol-tests.log 2>&1
          python scripts/geogebra/pointer-v2/test_coverage.py > artifacts/native-api/pointer-v2/coverage-tests.log 2>&1
      - name: Independent native pointer capture, without internal audit during input
        run: python scripts/geogebra/pointer-v2/capture.py --engine famtutor --output artifacts/native-api/pointer-v2/native.json
      - name: Independent pinned GeoGebra pointer capture
        if: ${{ !cancelled() }}
        run: python scripts/geogebra/pointer-v2/capture.py --engine geogebra --output artifacts/native-api/pointer-v2/reference.json
      - name: Strict actual timing and complete public callback comparison
        if: ${{ !cancelled() }}
        run: python scripts/geogebra/pointer-v2/compare.py artifacts/native-api/pointer-v2/native.json artifacts/native-api/pointer-v2/reference.json artifacts/native-api/pointer-v2/comparison.json
      - name: Separate native document/evaluator/renderer audit
        if: ${{ !cancelled() }}
        run: |
          python scripts/geogebra/pointer-v2/capture.py --engine famtutor --replicates 1 --audit-native --output artifacts/native-api/pointer-v2/audit.json
          python scripts/geogebra/pointer-v2/audit.py artifacts/native-api/pointer-v2/audit.json artifacts/native-api/pointer-v2/audit-comparison.json
      - name: Fixed-source matrix with exact native and versioned pointer evidence
        if: ${{ !cancelled() }}
        run: |
          python scripts/geogebra/native-api/test_coverage.py
          python scripts/geogebra/native-api/test_state_coverage.py
          python scripts/geogebra/pointer/test_coverage.py
          python scripts/geogebra/build-compatibility-matrix.py --output artifacts/native-api/inventory
          python scripts/geogebra/native-api/coverage.py --matrix artifacts/native-api/inventory/matrix.json --evidence artifacts/native-api
          python scripts/geogebra/native-api/state-coverage.py --matrix artifacts/native-api/inventory/matrix.json --evidence artifacts/native-api
          python scripts/geogebra/pointer-v2/coverage.py --matrix artifacts/native-api/inventory/matrix.json --evidence artifacts/native-api/pointer-v2
      - name: Tested source remains unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-api-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native-api/
          retention-days: 14
          if-no-files-found: error
