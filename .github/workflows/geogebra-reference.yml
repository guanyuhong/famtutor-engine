name: GeoGebra reference capture
on:
  push:
    branches: [codex/geogebra-case-runtime-v02]
    paths:
      - scripts/geogebra/capture-reference.py
      - .github/workflows/geogebra-reference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0 && python -m playwright install --with-deps chromium
      - run: python scripts/geogebra/capture-reference.py --author-material
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geogebra-reference-research-only
          path: artifacts/reference
          retention-days: 3
