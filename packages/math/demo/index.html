<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FamTutor Math MountedRenderer Live Demo</title>
  <link rel="stylesheet" href="../vendor/jsxgraph/jsxgraph.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>FamTutor Math Runtime v0.2 — Live MountedRenderer</h1>
      <p>mountMathRenderer · ChangeSet rebuild · interaction commits · event log</p>
    </div>
    <select id="example">
      <option value="perpendicular-bisector.json">垂直平分线</option>
      <option value="function-slider.json">参数函数</option>
      <option value="circle-intersections.json">两圆交点</option>
      <option value="transformations.json">二维变换</option>
      <option value="command-catalog-coverage.json">命令覆盖场景</option>
    </select>
  </header>
  <main>
    <section class="panel"><div id="board"></div></section>
    <aside class="panel">
      <div class="status">
        <span class="badge" id="validation">Loading</span>
        <span class="badge" id="revision">rev —</span>
        <span class="badge" id="strategy">—</span>
      </div>
      <div class="actions">
        <button type="button" id="btn-agent">模拟 Agent ChangeSet</button>
        <button type="button" id="btn-illegal">非法 ChangeSet</button>
      </div>
      <h2>状态</h2>
      <pre id="report"></pre>
      <h2>Events</h2>
      <pre id="events"></pre>
    </aside>
  </main>
  <script src="../vendor/jsxgraph/jsxgraphcore.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
